- timestamp:  "2026-04-12T01:00:00+07:00"
  type:       INSIGHT
  actor:      "dev-agent"
  artifact:   "asyncpg-jsonb-pattern"
  message:    "CRITICAL PATTERN: asyncpg registers a JSONB codec that auto-encodes Python dict/list to JSON. Calling json.dumps() before passing to asyncpg causes double-serialization — value stored as JSON string instead of JSON object. Always pass Python objects directly to asyncpg JSONB parameters. Fix existing records with: UPDATE t SET col = (col #>> '{}')::jsonb WHERE jsonb_typeof(col) = 'string'."

